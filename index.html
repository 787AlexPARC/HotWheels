<style>

.hw-title { font-family:'Racing Sans One', 'Bungee', sans-serif; font-size:clamp(2.5rem, 9vw, 7rem); font-weight:400; letter-spacing:0.02em; line-height:0.95; text-align:center; padding:0 1rem; position:relative; background:linear-gradient(180deg, #ffe066 0%, #ffaa00 30%, #ff5500 65%, #d41414 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 4px 0 #7a0000) drop-shadow(0 0 30px rgba(255,100,0,0.9)); transform:perspective(600px) rotateX(-8deg) skewX(-3deg); animation:titlePulse 2.4s ease-in-out infinite; }
@keyframes titlePulse { 0%,100% { filter:drop-shadow(0 4px 0 #7a0000) drop-shadow(0 0 25px rgba(255,100,0,0.8)); } 50% { filter:drop-shadow(0 4px 0 #7a0000) drop-shadow(0 0 45px rgba(255,180,0,1)); } }
.hw-title .accent { display:block; font-size:0.45em; letter-spacing:0.35em; color:#fff; -webkit-text-fill-color:#fff; background:none; margin-top:0.4rem; text-shadow:0 0 20px #00c8ff, 0 0 40px #0088ff; font-family:'Orbitron', sans-serif; font-weight:900; transform:none; }

.start-btn { position:relative; padding:1rem 3rem; font-family:'Racing Sans One', 'Orbitron', sans-serif; font-size:clamp(1rem, 1.8vw, 1.7rem); letter-spacing:0.15em; text-transform:uppercase; cursor:pointer; color:#fff; text-shadow:0 2px 0 #7a0000, 0 0 10px #ffcc00; border:3px solid #ffcc00; border-radius:60px; background:linear-gradient(180deg, #ff8800 0%, #ff4400 50%, #cc0000 100%); box-shadow:0 0 30px #ff6600, 0 0 60px #ff3300, inset 0 0 25px rgba(255,255,255,0.35), inset 0 -6px 0 rgba(0,0,0,0.25); transition:transform 0.15s, box-shadow 0.3s; animation:btnPulse 1.4s infinite alternate; overflow:hidden; }

.hud-speed { font-family:'Orbitron', sans-serif; font-weight:900; font-size:clamp(0.7rem, 1.3vw, 1.1rem); letter-spacing:0.12em; color:#00e0ff; text-shadow:0 0 15px #00aaff, 0 0 30px #0088ff; background:rgba(0,0,0,0.6); padding:0.4rem 1rem; border-radius:40px; border:2px solid #00c8ff; white-space:nowrap; }
.race-subtitle-wrap { position:absolute; top:22%; left:0; right:0; display:flex; justify-content:center; pointer-events:none; padding:0 0.8rem; }
.race-subtitle { font-family:'Orbitron', sans-serif; font-size:clamp(0.85rem, 2.2vw, 1.9rem); font-weight:900; letter-spacing:0.03em; text-align:center; padding:0.6rem 1.4rem; border-radius:60px; background:rgba(0,0,0,0.75); border-left:5px solid #ff7700; border-right:5px solid #ff7700; white-space:normal; max-width:92vw; line-height:1.25; animation:subtitlePop 0.5s ease-out; opacity:0; transition:opacity 0.3s; }

.race-progress-wrap { position:absolute; bottom:5vh; left:50%; transform:translateX(-50%); width:80%; max-width:700px; height:10px; border-radius:10px; background:rgba(255,255,255,0.12); overflow:hidden; border:2px solid #ff990055; }
.race-progress { height:100%; width:0%; background:linear-gradient(90deg, #ff2200, #ff9900, #ffcc00); box-shadow:0 0 20px #ffaa00, 0 0 40px #ff6600; transition:width 0.2s linear; }
#phase4 { background:rgba(0,0,0,0.9); backdrop-filter:blur(12px); padding:1rem; overflow-y:auto; }
.letter-layout { display:flex; gap:1.5rem; align-items:center; justify-content:center; width:100%; max-width:1200px; flex-wrap:wrap; padding:0.5rem; }
.letter-card { width:min(500px, 92vw); padding:clamp(1.4rem, 3vw, 2.4rem); border-radius:28px; background:linear-gradient(160deg, #1a0d00, #050505); border:3px solid #ffaa00; text-align:center; animation:cardIn 0.7s cubic-bezier(.2,.9,.3,1.3); position:relative; max-height:80vh; overflow-y:auto; scrollbar-width:thin; scrollbar-color:#ff7700 #111; }
.letter-card::before { content:""; position:absolute; top:-15px; left:50%; transform:translateX(-50%); width:60%; height:6px; background:linear-gradient(90deg, transparent, #ffcc00, #ff4400, #ffcc00, transparent); border-radius:3px; filter:blur(1px); }
.letter-card::-webkit-scrollbar { width:6px; }
.letter-card::-webkit-scrollbar-track { background:#111; border-radius:4px; }
.letter-card::-webkit-scrollbar-thumb { background:linear-gradient(180deg,#ff7700,#ffaa00); border-radius:4px; }

.letter-card h2 { font-family:'Racing Sans One', sans-serif; font-size:clamp(1.2rem, 2.6vw, 2rem); margin-bottom:1rem; letter-spacing:0.04em; text-shadow:0 0 20px currentColor, 0 2px 0 rgba(0,0,0,0.6); }
.letter-card p { font-size:clamp(0.75rem, 1.3vw, 1rem); line-height:1.65; color:#e8e8e8; margin-bottom:1.6rem; font-weight:400; letter-spacing:0.02em; }
.letter-buttons { display:flex; gap:0.7rem; justify-content:center; flex-wrap:wrap; }
.letter-buttons button { font-family:'Orbitron', sans-serif; font-size:clamp(0.7rem, 1.2vw, 0.95rem); font-weight:700; letter-spacing:0.08em; padding:0.7rem 1.4rem; border-radius:50px; cursor:pointer; background:transparent; color:#fff; border:2px solid #666; transition:all 0.25s; }
.letter-buttons button:hover { transform:translateY(-3px); }
.letter-buttons .repeat-btn { border-color:#ffaa00; color:#ffcc00; }
.letter-buttons .repeat-btn:hover { box-shadow:0 0 30px #ffaa00; background:rgba(255,170,0,0.15); }
.letter-buttons .garage-btn { border-color:#00c8ff; color:#00e0ff; }
.letter-buttons .garage-btn:hover { box-shadow:0 0 30px #00c8ff; background:rgba(0,200,255,0.15); }
.model-viewer { width:min(500px, 92vw); height:min(420px, 55vh); border-radius:28px; background:radial-gradient(ellipse at center, rgba(255,119,0,0.1), rgba(0,0,0,0.95) 70%); border:3px solid #ff7700; box-shadow:0 0 60px rgba(255,119,0,0.5), inset 0 0 60px rgba(255,119,0,0.12); position:relative; overflow:hidden; animation:cardIn 0.9s cubic-bezier(.2,.9,.3,1.3); }
.model-viewer canvas { width:100% !important; height:100% !important; display:block; }
.model-viewer .viewer-label { position:absolute; top:12px; left:50%; transform:translateX(-50%); font-family:'Racing Sans One', sans-serif; font-size:clamp(0.6rem, 0.95vw, 0.8rem); letter-spacing:0.25em; color:#ffe066; text-shadow:0 0 10px #ff7700; text-transform:uppercase; z-index:5; pointer-events:none; }
#loader { position:fixed; inset:0; z-index:200; background:#000; display:flex; justify-content:center; align-items:center; flex-direction:column; gap:0.9rem; transition:opacity 0.6s; padding:1rem; }
#loader.hidden { opacity:0; pointer-events:none; }
.loader-logo-space { width:min(320px, 75vw); height:140px; margin-bottom:1rem; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
.loader-logo-space img { max-width:100%; max-height:100%; object-fit:contain; filter:drop-shadow(0 0 25px rgba(255,119,0,0.85)); animation:logoPulse 2s ease-in-out infinite; }
@keyframes logoPulse { 0%, 100% { filter:drop-shadow(0 0 20px rgba(255,119,0,0.7)); transform:scale(1); } 50% { filter:drop-shadow(0 0 50px rgba(255,150,0,1)); transform:scale(1.06); } }
.loader-logo-space .placeholder-text { color:#ff7700; font-size:0.65rem; letter-spacing:0.25em; opacity:0.45; text-align:center; position:absolute; padding:0 0.5rem; }
.spinner { width:46px; height:46px; border-radius:50%; border:3px solid #222; border-top-color:#ff7700; animation:spin 1s linear infinite; }

#loader .progress-text { color:#888; font-size:0.7rem; letter-spacing:0.2em; }
.progress-bar-wrap { width:min(400px, 80vw); height:6px; background:#222; border-radius:3px; overflow:hidden; }
.progress-bar { height:100%; width:0%; background:linear-gradient(90deg,#ff2200,#ff9900,#ffcc00); box-shadow:0 0 12px #ffaa00; transition:width 0.2s; }
.skip-btn { position:fixed; bottom:20px; right:20px; z-index:50; background:rgba(0,0,0,0.7); color:#ffcc00; border:2px solid #ff7700; font-family:'Orbitron', sans-serif; padding:0.5rem 1rem; border-radius:40px; cursor:pointer; font-size:0.75rem; letter-spacing:0.15em; opacity:0; transition:opacity 0.3s; }

</style>

<body>
<div id="scene-container"></div>
<div class="vignette"></div>

</div>

  <img src="logo.png" alt="" class="hw-logo corner-tl" onerror="this.style.display='none'">
  <img src="logo.png" alt="" class="hw-logo corner-tr" onerror="this.style.display='none'">

  <img src="logo.png" alt="" class="hw-logo corner-tl" style="width:clamp(50px,6vw,90px); opacity:0.8;" onerror="this.style.display='none'">

  <div class="hud-top">

  </div>

    <div id="raceSubtitle" class="race-subtitle"></div>
  </div>

    <div id="raceProgress" class="race-progress"></div>
  </div>
</div>

  <img src="logo.png" alt="" class="hw-logo corner-tl" onerror="this.style.display='none'">
  <img src="logo.png" alt="" class="hw-logo corner-tr" onerror="this.style.display='none'">
  <div class="letter-layout">
    <div id="letterCard" class="letter-card">
      <h2 id="letterTitle">Para ti</h2>
      <p id="letterBody">...</p>
      <div class="letter-buttons">
        <button id="repeatBtn" class="repeat-btn">Repetir carrera</button>

      </div>
    </div>
    <div class="model-viewer" id="modelViewer">
      <div class="viewer-label"> HOT WHEELS</div>
    </div>
  </div>
</div>

<button id="skipBtn" class="skip-btn">Saltar carrera ⏭</button>

  }

</script>

<script type="module">
import * as THREE from 'three';

let activeCar = null;

const PHRASE_DURATION = 4.5;

let modelViewerEl;
let loaderEl, loadProgressEl, loadTextEl;
let sceneContainerEl, warpOverlay, warpRays;

// ========================================================
// CARS
// ========================================================
const CARS = [
  { id: 'raptor', file: 'raptor.glb', name: 'FORD F-150 RAPTOR',
    color: 0xffffff, rotationY: Math.PI, image: 'raptor.png',
    phrases: ["Contigo no existen caminos difíciles ni baches que nos puedan frenar. 🏔️","Este motor ruge fuerte, pero mi corazón late más rápido cuando te subes.","Me encanta cómo se siente el viaje cuando tú eres quien maneja mi vida.","Eres la única persona capaz de hacerme sentir a salvo en cualquier terreno.","Aunque tengamos tracción en las cuatro ruedas, tú eres mi único agarre seguro.","Contigo iría hasta el fin del mundo, sin importar si hay carretera o no. ✨","Llegamos a la meta, pero este viaje todoterreno a tu lado apenas empieza. 🖤"],

let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playEngine() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(80, now);
  osc.frequency.linearRampToValueAtTime(240, now + 0.5);
  osc.frequency.linearRampToValueAtTime(130, now + 1.0);
  gain.gain.setValueAtTime(0.12, now);
  gain.gain.linearRampToValueAtTime(0.25, now + 0.2);
  gain.gain.linearRampToValueAtTime(0, now + 1.2);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now); osc.stop(now + 1.2);
}
function playScreech() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(900, now);
  osc.frequency.exponentialRampToValueAtTime(280, now + 0.5);
  gain.gain.setValueAtTime(0.2, now);
  gain.gain.linearRampToValueAtTime(0, now + 0.6);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now); osc.stop(now + 0.6);
}
function playBlip() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(660, now);
  osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
  gain.gain.setValueAtTime(0.08, now);
  gain.gain.linearRampToValueAtTime(0, now + 0.15);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now); osc.stop(now + 0.15);
}
function playWarp() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(120, now);
  osc.frequency.exponentialRampToValueAtTime(1800, now + 0.9);
  osc.frequency.exponentialRampToValueAtTime(300, now + 1.3);
  gain.gain.setValueAtTime(0.001, now);
  gain.gain.exponentialRampToValueAtTime(0.18, now + 0.4);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 1.3);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now); osc.stop(now + 1.3);
}

// ============ TEXTURAS HELPER ============
function makeRadialGlowTexture(r, g, b, size = 512) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0, `rgba(${r},${g},${b},0.9)`);
  grad.addColorStop(0.3, `rgba(${r},${g},${b},0.4)`);
  grad.addColorStop(0.7, `rgba(${r},${g},${b},0.1)`);
  grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function makeDotTexture() {
  const size = 64;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.4, 'rgba(255,255,255,0.6)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const spiralPoints = [];

const SPIRAL_ARMS = 4;
const PARTICLES_PER_ARM = 500;
const GALAXY_RADIUS = 14;

  const armOffset = (arm / SPIRAL_ARMS) * Math.PI * 2;
  for (let i = 0; i < PARTICLES_PER_ARM; i++) {
    const t = i / PARTICLES_PER_ARM;
    const radius = 0.5 + t * GALAXY_RADIUS;
    const angle = armOffset + t * Math.PI * 3.5;
    const spread = (Math.random() - 0.5) * (0.4 + t * 1.8);
    const spreadY = (Math.random() - 0.5) * (0.3 + t * 0.9);
    spiralPoints.push(Math.cos(angle) * radius + spread, spreadY, Math.sin(angle) * radius + spread);
    const mix = t;
    spiralColors.push(1.0 * (1 - mix) + 0.0 * mix, 0.55 * (1 - mix) + 0.75 * mix, 0.15 * (1 - mix) + 1.0 * mix);
  }
}
const spiralGeo = new THREE.BufferGeometry();
spiralGeo.setAttribute('position', new THREE.Float32BufferAttribute(spiralPoints, 3));
spiralGeo.setAttribute('color', new THREE.Float32BufferAttribute(spiralColors, 3));

const emojiSprites = [];
const emojiColors = ['#ff7700', '#ffcc00', '#00c8ff', '#ff4488', '#00ffaa', '#ff2266', '#aa66ff'];
function makeEmojiTexture(emoji, glowColor) {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.font = `${size * 0.7}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = glowColor;
  ctx.shadowBlur = 30;
  ctx.fillText(emoji, size/2, size/2 + 6);
  ctx.fillText(emoji, size/2, size/2 + 6);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  return tex;
}
const EMOJI_COUNT = 220;
const EMOJI_MIN_RADIUS = 24;
const EMOJI_MAX_RADIUS = 100;
const EMOJI_Y_COMPRESS = 0.45;
function fibSpherePoint(i, n) {
  const k = i + 0.5;
  const phi = Math.acos(1 - 2 * k / n);
  const theta = Math.PI * (1 + Math.sqrt(5)) * k;
  return { phi, theta };
}
for (let i = 0; i < EMOJI_COUNT; i++) {
  const emoji = SPEED_EMOJIS[Math.floor(Math.random() * SPEED_EMOJIS.length)];
  const glowColor = emojiColors[Math.floor(Math.random() * emojiColors.length)];
  const tex = makeEmojiTexture(emoji, glowColor);
  const mat = new THREE.SpriteMaterial({
    map: tex, transparent: true, depthWrite: false, blending: THREE.NormalBlending, opacity: 0.9
  });
  const sprite = new THREE.Sprite(mat);
  const scale = 0.5 + Math.random() * 1.3;
  sprite.scale.set(scale, scale, 1);
  const { phi, theta } = fibSpherePoint(i, EMOJI_COUNT);
  const t = (i * 0.61803398875) % 1;
  const r = EMOJI_MIN_RADIUS + t * (EMOJI_MAX_RADIUS - EMOJI_MIN_RADIUS);
  const x = r * Math.sin(phi) * Math.cos(theta);
  const y = r * Math.cos(phi) * EMOJI_Y_COMPRESS;
  const z = r * Math.sin(phi) * Math.sin(theta);
  sprite.position.set(x, y, z);
  const baseR = Math.sqrt(x * x + z * z);
  const baseAngle = Math.atan2(z, x);
  sprite.userData = {
    baseY: y,
    baseR,
    baseAngle,
    orbitSpeed: (Math.random() - 0.5) * 0.08,
    floatSpeed: 0.3 + Math.random() * 1.1,
    floatPhase: Math.random() * Math.PI * 2,
    floatAmp: 0.6 + Math.random() * 2.0,
    rotSpeed: (Math.random() - 0.5) * 1.8,
    baseOpacity: mat.opacity,
    twinkleSpeed: 0.8 + Math.random() * 2.5,
    twinklePhase: Math.random() * Math.PI * 2,
    scaleBase: scale,
    scaleAmp: 0.05 + Math.random() * 0.15,
    scaleSpeed: 0.5 + Math.random() * 1.5,
    scalePhase: Math.random() * Math.PI * 2
  };
  spaceDecorGroup.add(sprite);
  emojiSprites.push(sprite);
}

function makeCarSpriteTexture(car) {
  const canvas = document.createElement('canvas');
  const size = 512;
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    ctx.clearRect(0, 0, size, size);
    const ratio = img.width / img.height;
    let w = size * 0.85;
    let h = w / ratio;
    if (h > size * 0.85) { h = size * 0.85; w = h * ratio; }
    const x = (size - w) / 2;
    const y = (size - h) / 2;
    ctx.shadowColor = '#' + car.color.toString(16).padStart(6, '0');
    ctx.shadowBlur = 40;
    ctx.drawImage(img, x, y, w, h);
    ctx.drawImage(img, x, y, w, h);
    tex.needsUpdate = true;
  };
  img.onerror = () => {
    ctx.clearRect(0, 0, size, size);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(40, 40, size-80, size-80);
    ctx.strokeStyle = '#' + car.color.toString(16).padStart(6, '0');
    ctx.lineWidth = 4;
    ctx.setLineDash([12, 8]);
    ctx.strokeRect(40, 40, size-80, size-80);
    ctx.fillStyle = '#' + car.color.toString(16).padStart(6, '0');
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(car.name, size/2, size/2);
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText('[ PON TU PNG ]', size/2, size/2 + 40);
    tex.needsUpdate = true;
  };
  img.src = car.image;
  return tex;
}
function makePhraseSpriteTexture(text, colorHex) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const fontSize = 64;
  ctx.font = `900 ${fontSize}px 'Orbitron', 'Segoe UI', Arial, sans-serif`;
  const metrics = ctx.measureText(text);
  const padX = fontSize * 1.2;
  const padY = fontSize * 1.0;
  canvas.width = Math.ceil(metrics.width + padX * 2);
  canvas.height = Math.ceil(fontSize + padY * 2);
  const c = canvas.getContext('2d');
  c.font = `900 ${fontSize}px 'Orbitron', 'Segoe UI', Arial, sans-serif`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  c.lineWidth = fontSize * 0.18;
  c.strokeStyle = '#000000';
  c.lineJoin = 'round';
  c.strokeText(text, cx, cy);
  c.shadowColor = colorHex;
  c.shadowBlur = fontSize * 0.7;
  c.fillStyle = colorHex;
  c.fillText(text, cx, cy);
  c.fillText(text, cx, cy);
  c.shadowBlur = 0;
  c.fillStyle = '#ffffff';
  c.fillText(text, cx, cy);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  return tex;
}
function buildGalaxy() {

    const sprite = new THREE.Sprite(mat);
    const s = isMobile ? 5 : 6;
    sprite.scale.set(s, s, 1);
    sprite.position.set(Math.cos(angle) * carRadius, y, Math.sin(angle) * carRadius);
    sprite.userData = {
      carId: car.id, carData: car, baseAngle: angle, baseRadius: carRadius, baseY: y,

      floatAmp: 0.6 + Math.random() * 1.2, orbitSpeed: 0.03 + Math.random() * 0.03, isCar: true
    };
    galaxyGroup.add(sprite);
    carSprites.push(sprite);
  });
  const phraseColors = ['#ff7700', '#00c8ff', '#ffcc00', '#ff4488', '#00ffaa', '#ff2266', '#aa66ff'];
  SPACE_PHRASES.forEach((phrase, i) => {
    const angle = Math.random() * Math.PI * 2;

    const sprite = new THREE.Sprite(mat);
    const h = 0.9 + Math.random() * 0.4;
    const aspect = tex.image.width / tex.image.height;
    sprite.scale.set(h * aspect, h, 1);
    sprite.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
    sprite.userData = {
      baseAngle: angle, baseRadius: radius, baseY: y,
      floatSpeed: 0.3 + Math.random() * 0.6, floatPhase: Math.random() * Math.PI * 2,
      floatAmp: 0.5 + Math.random() * 1.0, orbitSpeed: (Math.random() - 0.5) * 0.04, isPhrase: true
    };
    galaxyGroup.add(sprite);
    phraseSprites.push(sprite);
  });
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDownPos = { x: e.clientX, y: e.clientY, t: performance.now() };
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!pointerDownPos) return;
  const dx = e.clientX - pointerDownPos.x;
  const dy = e.clientY - pointerDownPos.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const dt = performance.now() - pointerDownPos.t;
  pointerDownPos = null;
  if (dist > 8 || dt > 500) return;
  if (!phase2 || phase2.classList.contains('hidden')) return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouseNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouseNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouseNDC, camera);
  const intersects = raycaster.intersectObjects(carSprites, false);
  if (intersects.length > 0) {
    const hit = intersects[0].object;
    if (hit.userData.carId) {
      initAudio();
      playBlip();
      openCarCard(hit.userData.carId);
    }
  }
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!phase2 || phase2.classList.contains('hidden')) {
    renderer.domElement.style.cursor = 'default';
    return;
  }
  const rect = renderer.domElement.getBoundingClientRect();
  mouseNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouseNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouseNDC, camera);
  const hits = raycaster.intersectObjects(carSprites, false);
  renderer.domElement.style.cursor = hits.length > 0 ? 'pointer' : 'default';
});

const TARGET_LENGTH = 5.0;
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');
const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

function updateLoadProgress() {
  const pct = Math.round((loadedCount / totalToLoad) * 100);
  if (loadProgressEl) loadProgressEl.style.width = pct + '%';
  if (loadTextEl) loadTextEl.textContent = pct + '%';
  if (loadedCount >= totalToLoad && loaderEl) {
    setTimeout(() => loaderEl.classList.add('hidden'), 400);
  }
}

function processModel(model, car) {
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = TARGET_LENGTH / maxDim;
  model.scale.setScalar(scale);
  const box2 = new THREE.Box3().setFromObject(model);
  const center2 = box2.getCenter(new THREE.Vector3());
  const min2 = box2.min;
  model.position.x -= center2.x;
  model.position.z -= center2.z;
  model.position.y -= min2.y;
  model.traverse(child => {
    if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
  });
  return { model, size: size.clone().multiplyScalar(scale) };
}

function loadModel(car) {
  return new Promise((resolve) => {
    gltfLoader.load(car.file, (gltf) => {
      const result = processModel(gltf.scene, car);
      modelCache[car.id] = { scene: result.model, size: result.size, rotationY: car.rotationY || 0, carData: car };
      loadedCount++;
      updateLoadProgress();
      resolve(modelCache[car.id]);
    }, undefined, (err) => {
      console.warn('Error cargando', car.file, '--- usando placeholder');
      const geo = new THREE.BoxGeometry(2.4, 1.5, 5);
      const mat = new THREE.MeshStandardMaterial({ color: car.color, emissive: car.color, emissiveIntensity: 0.4, roughness: 0.4, metalness: 0.6 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = 0.75;
      const group = new THREE.Group();
      group.add(mesh);
      modelCache[car.id] = { scene: group, rotationY: car.rotationY || 0, carData: car };
      loadedCount++;
      updateLoadProgress();
      resolve(modelCache[car.id]);
    });
  });
}

function initModelViewer(carId) {
  if (viewerAnimId) cancelAnimationFrame(viewerAnimId);
  if (viewerRenderer) {
    viewerRenderer.dispose();
    modelViewerEl.querySelectorAll('canvas').forEach(c => c.remove());
  }
  viewerModel = null;
  const width = modelViewerEl.clientWidth;
  const height = modelViewerEl.clientHeight;
  viewerRenderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  viewerRenderer.setSize(width, height);
  viewerRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  viewerRenderer.toneMapping = THREE.ACESFilmicToneMapping;
  viewerRenderer.toneMappingExposure = 1.3;
  viewerRenderer.shadowMap.enabled = true;
  modelViewerEl.appendChild(viewerRenderer.domElement);

  viewerScene = new THREE.Scene();
  viewerScene.add(new THREE.AmbientLight(0xffffff, 1.2));
  viewerScene.add(new THREE.HemisphereLight(0x00c8ff, 0xff7700, 1.0));
  const key = new THREE.DirectionalLight(0xffffff, 2.0);
  key.position.set(5, 10, 7);
  key.castShadow = true;
  viewerScene.add(key);
  const cached = modelCache[carId];
  const color = cached.carData.color;
  const rim = new THREE.DirectionalLight(color, 2.0);
  rim.position.set(-6, 4, -6);
  viewerScene.add(rim);
  const fill = new THREE.DirectionalLight(0xffffff, 0.8);
  fill.position.set(0, -3, 5);
  viewerScene.add(fill);

  const modelClone = cached.scene.clone(true);
  modelClone.rotation.y = cached.rotationY;
  viewerScene.add(modelClone);
  viewerModel = modelClone;

  const box = new THREE.Box3().setFromObject(modelClone);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const cam = new THREE.PerspectiveCamera(35, width/height, 0.1, 100);
  const dist = maxDim * 2.0;
  cam.position.set(center.x + dist * 0.7, center.y + dist * 0.45, center.z + dist * 0.85);
  cam.lookAt(center.x, center.y, center.z);
  viewerCamera = cam;

  const groundGeo = new THREE.CircleGeometry(maxDim * 2, 32);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.4, metalness: 0.8, transparent: true, opacity: 0.4 });
  const groundPlane = new THREE.Mesh(groundGeo, groundMat);
  groundPlane.rotation.x = -Math.PI / 2;
  groundPlane.position.y = box.min.y - 0.01;
  viewerScene.add(groundPlane);

  const startTime = performance.now();
  function animateViewer() {
    viewerAnimId = requestAnimationFrame(animateViewer);
    const t = (performance.now() - startTime) / 1000;
    if (viewerModel) {
      viewerModel.rotation.y = cached.rotationY + t * 0.6;
      viewerModel.position.y = Math.sin(t * 1.5) * 0.05;
    }
    viewerRenderer.render(viewerScene, viewerCamera);
  }
  animateViewer();
}

function closeModelViewer() {
  if (viewerAnimId) cancelAnimationFrame(viewerAnimId);
  if (viewerRenderer) {
    viewerRenderer.dispose();
    modelViewerEl.querySelectorAll('canvas').forEach(c => c.remove());
  }
  viewerRenderer = null; viewerScene = null; viewerCamera = null; viewerModel = null;
}

const sparkPool = [];
const sparkGeometry = new THREE.SphereGeometry(0.12, 6, 6);
for (let i = 0; i < 220; i++) {
  const mat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0 });
  const spark = new THREE.Mesh(sparkGeometry, mat);
  spark.visible = false;
  spark.frustumCulled = false;
  spark.userData = { life:0, vel:new THREE.Vector3() };
  scene.add(spark);
  sparkPool.push(spark);
}
let sparkIndex = 0;
function emitSpark(pos, colorHint) {
  const spark = sparkPool[sparkIndex];
  sparkIndex = (sparkIndex + 1) % sparkPool.length;
  spark.position.copy(pos);
  if (colorHint === 'cyan') spark.material.color.setHex(0x00e0ff);
  else spark.material.color.setHex(Math.random() > 0.5 ? 0xffaa00 : 0xff5500);
  spark.material.opacity = 1;
  spark.visible = true;
  spark.userData.life = 0.45;
  spark.userData.vel.set((Math.random()-0.5)*0.5, Math.random()*0.35 + 0.05, (Math.random()-0.5)*0.5);
  spark.scale.setScalar(1 + Math.random()*1.8);
}

// ============ DOM REFS ============
function initDOMRefs() {
  phase1 = document.getElementById('phase1');
  phase2 = document.getElementById('phase2');
  phase3 = document.getElementById('phase3');
  phase4 = document.getElementById('phase4');
  startBtn = document.getElementById('startBtn');
  raceSubtitle = document.getElementById('raceSubtitle');
  raceProgress = document.getElementById('raceProgress');
  hudSpeed = document.getElementById('hudSpeed');
  hudLap = document.getElementById('hudLap');
  letterTitle = document.getElementById('letterTitle');
  letterBody = document.getElementById('letterBody');
  letterCard = document.getElementById('letterCard');
  repeatBtn = document.getElementById('repeatBtn');
  garageBtn = document.getElementById('garageBtn');
  speedFlash = document.getElementById('speedFlash');
  skipBtn = document.getElementById('skipBtn');
  speedLinesBg = document.getElementById('speedLinesBg');
  modelViewerEl = document.getElementById('modelViewer');
  loaderEl = document.getElementById('loader');
  loadProgressEl = document.getElementById('loadProgress');
  loadTextEl = document.getElementById('loadText');
  sceneContainerEl = document.getElementById('scene-container');
  warpOverlay = document.getElementById('warpOverlay');
  warpRays = document.getElementById('warpRays');
}
initDOMRefs();
sceneContainerEl.classList.add('hidden-until-start');

// ============ FUNCIONES DE CARRERA ============
function removeActiveCar() {
  if (activeCar) { scene.remove(activeCar.group); activeCar = null; }
  rainGroup.visible = false;
  carKeyLight.visible = false;
  carRimLight.visible = false;
  carWarmLight.visible = false;
  // carSpotGlow eliminado
  scene.fog = new THREE.FogExp2(0x03030a, 0.0065);
}

function cloneModelForScene(cached) {
  const clonedScene = cached.scene.clone(true);
  clonedScene.rotation.y = cached.rotationY;
  return clonedScene;
}

function startRace(carId) {
  if (!modelCache[carId]) return;
  activeCarType = carId;
  activeCarData = modelCache[carId].carData;
  carProgress = 0;
  currentSpeed = 0;
  raceActive = true;
  raceFinished = false;
  const phrases = activeCarData.phrases;
  const numPhrases = phrases.length;
  phraseTriggerProgress = phrases.map((_, i) => 0.08 + (i / numPhrases) * 0.80);
  phraseShown = new Array(numPhrases).fill(false);
  phraseTimer = 0;
  phraseActive = false;
  raceSubtitle.classList.remove('visible');
  raceSubtitle.textContent = '';

  removeActiveCar();
  const cached = modelCache[carId];
  const carGroup = new THREE.Group();
  const modelClone = cloneModelForScene(cached);
  carGroup.add(modelClone);
  const wheels = [];
  modelClone.traverse(child => {
    if (child.isMesh) {
      const name = (child.name || '').toLowerCase();
      if (name.includes('wheel') || name.includes('rueda') || name.includes('tire') || name.includes('llanta')) {
        wheels.push(child);
      }
    }
  });
  activeCar = { group: carGroup, wheels };
  scene.add(carGroup);
  carGroup.position.set(0, 0.1, 0);
  carGroup.rotation.set(0, 0, 0);

  // 🔥 Quitar la niebla durante la carrera
  scene.fog = null;

  // 🔧 CAMBIO 1: La lluvia sigue al auto con rainGroup.position.set
  rainGroup.visible = true;
  carKeyLight.visible = true;
  carRimLight.visible = true;
  carWarmLight.visible = true;

  // 🔧 CAMBIO 2: Reset de lluvia en coordenadas LOCALES (centradas en 0,0,0)
  // El rainGroup seguirá al auto, así que las gotas se colocan alrededor del origen local.
  const rp = rainGeo.attributes.position.array;
  for (let i = 0; i < RAIN_COUNT; i++) {
    rp[i*3]   = (Math.random() - 0.5) * RAIN_AREA_X;
    rp[i*3+1] = Math.random() * RAIN_AREA_Y;
    rp[i*3+2] = (Math.random() - 0.5) * RAIN_AREA_Z;
  }
  rainGeo.attributes.position.needsUpdate = true;

  const sp = rainStreakGeo.attributes.position.array;
  for (let i = 0; i < rainStreakCount; i++) {
    const s = streakData[i];
    const x = (Math.random() - 0.5) * RAIN_AREA_X;
    const y = Math.random() * RAIN_AREA_Y;
    const z = (Math.random() - 0.5) * RAIN_AREA_Z;
    sp[i*6] = x; sp[i*6+1] = y; sp[i*6+2] = z;
    sp[i*6+3] = x; sp[i*6+4] = y - s.len; sp[i*6+5] = z;
  }
  rainStreakGeo.attributes.position.needsUpdate = true;

  // Posicionar el grupo de lluvia en el auto
  rainGroup.position.copy(carGroup.position);

  phase1.classList.add('hidden');
  phase2.classList.add('hidden');
  phase4.classList.add('hidden');
  closeModelViewer();
  phase3.classList.remove('hidden');
  speedLinesBg.classList.remove('active');
  controls.enabled = false;
  controls.autoRotate = false;
  skipBtn.classList.add('show');
  hudSpeed.textContent = '0 KM/H';
  speedFlash.classList.add('active');
  setTimeout(() => speedFlash.classList.remove('active'), 500);
  playEngine();
}

function finishRace() {
  raceActive = false;
  raceFinished = true;
  playScreech();
  skipBtn.classList.remove('show');
  raceSubtitle.textContent = '🏁 ¡META! 🏁';
  raceSubtitle.classList.add('visible');
  raceSubtitle.style.color = '#ffcc00';
  raceSubtitle.style.textShadow = '0 0 40px #ffaa00, 0 0 80px #ff4500';
  setTimeout(() => {
    phase3.classList.add('hidden');
    phase4.classList.remove('hidden');
    const colorStr = '#' + activeCarData.color.toString(16).padStart(6, '0');
    letterTitle.textContent = activeCarData.letterTitle;
    letterBody.textContent = activeCarData.letterBody;
    letterCard.style.borderColor = colorStr;
    letterCard.style.boxShadow = `0 0 80px ${colorStr}, 0 0 140px ${colorStr}80`;
    letterTitle.style.color = colorStr;
    letterTitle.style.textShadow = `0 0 20px ${colorStr}`;
    setTimeout(() => initModelViewer(activeCarType), 200);
  }, 2000);
}

function showPhrase(idx) {
  const phrases = activeCarData.phrases;
  if (idx >= phrases.length) return;
  phraseActive = true;
  phraseTimer = PHRASE_DURATION;
  raceSubtitle.textContent = phrases[idx];
  const colorStr = '#' + activeCarData.color.toString(16).padStart(6, '0');
  raceSubtitle.style.color = '#fff';
  raceSubtitle.style.textShadow = `0 0 30px ${colorStr}, 0 0 60px ${colorStr}`;
  raceSubtitle.style.borderLeftColor = colorStr;
  raceSubtitle.style.borderRightColor = colorStr;
  raceSubtitle.classList.add('visible');
  raceSubtitle.style.animation = 'none';
  raceSubtitle.offsetHeight;
  raceSubtitle.style.animation = 'subtitlePop 0.5s ease-out';
  playBlip();
}

// ============ ANIMACIÓN ============
const clock = new THREE.Clock();
let galaxyTime = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;
  galaxyTime += dt;

  if (!phase2) { composer.render(); return; }

  neonLights.forEach((l, i) => {
    l.position.set(
      Math.sin(time * 0.8 + i) * 30,
      3 + Math.sin(time * 2 + i) * 1.5,
      -carProgress * TRACK_LENGTH + Math.cos(time * 0.6 + i) * 20
    );
    l.intensity = 2 + Math.sin(time * 5 + i) * 1.5;
  });

  galaxyCore.rotation.y += dt * 0.15;
  spiralParticles.rotation.y += dt * 0.05;
  ring1.rotation.z += dt * 0.4;
  ring2.rotation.z -= dt * 0.3;
  ring3.rotation.z += dt * 0.2;
  coreGlow.material.opacity = 0.7 + Math.sin(time * 2) * 0.2;
  starField.rotation.y += dt * 0.01;

  const dustArr = dustGeo.attributes.position.array;
  for (let i = 0; i < dustCount; i++) {
    const d = dustData[i];
    d.angle += d.speed * dt;
    dustArr[i*3] = Math.cos(d.angle) * d.radius;
    dustArr[i*3+1] = d.baseY + Math.sin(time * 1.5 + i) * 0.3;
    dustArr[i*3+2] = Math.sin(d.angle) * d.radius;
  }
  dustGeo.attributes.position.needsUpdate = true;

  twinkleMat.size = 0.32 + Math.sin(time * 3) * 0.08;
  twinkleStars.rotation.y += dt * 0.03;

  rayData.forEach((line) => {
    const ud = line.userData;
    ud.baseTheta += ud.orbitSpeed * dt;
    const r = ud.baseRadius;
    const phi = ud.basePhi;
    line.position.set(r * Math.sin(phi) * Math.cos(ud.baseTheta), r * Math.cos(phi) * 0.6, r * Math.sin(phi) * Math.sin(ud.baseTheta));
    line.lookAt(0, 0, 0);
    line.material.opacity = ud.baseOpacity * (0.5 + Math.abs(Math.sin(time * ud.flashSpeed + ud.flashPhase)) * 0.5);
  });

  emojiSprites.forEach((s) => {
    const ud = s.userData;
    ud.baseAngle += ud.orbitSpeed * dt;
    s.position.x = Math.cos(ud.baseAngle) * ud.baseR;
    s.position.z = Math.sin(ud.baseAngle) * ud.baseR;
    s.position.y = ud.baseY + Math.sin(time * ud.floatSpeed + ud.floatPhase) * ud.floatAmp;
    s.material.rotation += dt * ud.rotSpeed;
    const twinkle = 0.6 + Math.abs(Math.sin(time * ud.twinkleSpeed + ud.twinklePhase)) * 0.4;
    s.material.opacity = ud.baseOpacity * twinkle;
    const sScale = ud.scaleBase * (1 + Math.sin(time * ud.scaleSpeed + ud.scalePhase) * ud.scaleAmp);
    s.scale.set(sScale, sScale, 1);
  });

  if (!phase2.classList.contains('hidden')) {
    galaxyGroup.children.forEach((sprite) => {
      const ud = sprite.userData;
      if (!ud || ud.isGlow) return;
      ud.baseAngle += ud.orbitSpeed * dt;
      const r = ud.baseRadius;
      sprite.position.x = Math.cos(ud.baseAngle) * r;
      sprite.position.z = Math.sin(ud.baseAngle) * r;
      sprite.position.y = ud.baseY + Math.sin(galaxyTime * ud.floatSpeed + ud.floatPhase) * ud.floatAmp;
      if (sprite.material) {
        sprite.material.rotation = Math.sin(galaxyTime * 0.8 + ud.floatPhase) * 0.15;
      }
    });
  }

  // 🌧️ LLUVIA ESPACIAL
  if (rainGroup.visible && activeCar) {
    // 🔧 CAMBIO 1: El grupo de lluvia sigue al auto
    rainGroup.position.copy(activeCar.group.position);

    const carPos = activeCar.group.position;
    const rp = rainGeo.attributes.position.array;
    const halfX = RAIN_AREA_X * 0.5;
    const halfZ = RAIN_AREA_Z * 0.5;

    for (let i = 0; i < RAIN_COUNT; i++) {
      const v = rainVelocities[i];
      rp[i*3] += v.x * dt;
      rp[i*3+1] -= v.y * dt;
      rp[i*3+2] += v.z * dt;

      // 🔧 CAMBIO 2: Reset en coordenadas LOCALES (alrededor del origen local)
      const tooFar = Math.abs(rp[i*3]) > halfX ||
                     Math.abs(rp[i*3+2]) > halfZ ||
                     rp[i*3+1] < -10;

      if (tooFar) {
        rp[i*3]   = (Math.random() - 0.5) * RAIN_AREA_X;
        rp[i*3+1] = RAIN_AREA_Y * (0.5 + Math.random() * 0.5);
        rp[i*3+2] = (Math.random() - 0.5) * RAIN_AREA_Z;
      }
    }
    rainGeo.attributes.position.needsUpdate = true;

    const sp = rainStreakGeo.attributes.position.array;
    for (let i = 0; i < rainStreakCount; i++) {
      const s = streakData[i];
      sp[i*6+1] -= s.speed * dt;
      sp[i*6+4] = sp[i*6+1] - s.len;

      // 🔧 CAMBIO 2: Reset en coordenadas LOCALES
      const tooFarS = Math.abs(sp[i*6]) > halfX ||
                      Math.abs(sp[i*6+2]) > halfZ ||
                      sp[i*6+1] < -10;

      if (tooFarS) {
        const nx = (Math.random() - 0.5) * RAIN_AREA_X;
        const nz = (Math.random() - 0.5) * RAIN_AREA_Z;
        const ny = RAIN_AREA_Y * (0.5 + Math.random() * 0.5);
        sp[i*6]   = nx; sp[i*6+1] = ny; sp[i*6+2] = nz;
        sp[i*6+3] = nx; sp[i*6+4] = ny - s.len; sp[i*6+5] = nz;
      }
    }
    rainStreakGeo.attributes.position.needsUpdate = true;

    rainMat.opacity = 0.85 + Math.sin(time * 8) * 0.15 + (Math.random() > 0.985 ? 0.15 : 0);

    // 💡 LUCES DEL AUTO (se mantienen en coordenadas de MUNDO para iluminar bien)
    const cp = activeCar.group.position;
    carKeyLight.position.set(cp.x + 3, cp.y + 6, cp.z + 4);
    carKeyLight.intensity = 2.5;
    carRimLight.position.set(cp.x - 4, cp.y + 2, cp.z - 3);
    carRimLight.intensity = 2.0;
    carWarmLight.position.set(cp.x + 3, cp.y + 1, cp.z - 4);
    carWarmLight.intensity = 1.5;
  }

  if (activeCar && raceActive) {
    if (!phraseActive) {
      currentSpeed += (TARGET_SPEED - currentSpeed) * 0.4 * dt;
    } else {
      currentSpeed += (TARGET_SPEED * 0.35 - currentSpeed) * 0.8 * dt;
    }
    carProgress += currentSpeed * dt;
    if (carProgress >= 1) {
      carProgress = 1;
      if (!raceFinished) finishRace();
    }
    if (phraseActive) {
      phraseTimer -= dt;
      if (phraseTimer <= 0) {
        phraseActive = false;
        raceSubtitle.classList.remove('visible');
      }
    }
    if (!phraseActive && !raceFinished) {
      for (let i = 0; i < phraseTriggerProgress.length; i++) {
        if (!phraseShown[i] && carProgress >= phraseTriggerProgress[i]) {
          phraseShown[i] = true;
          showPhrase(i);
          break;
        }
      }
    }
    const bump = Math.sin(carProgress * 80) * 0.05;
    activeCar.group.position.x = 0;
    activeCar.group.position.y = 0.1 + bump + Math.sin(time * 55) * 0.015;
    activeCar.group.position.z = -carProgress * TRACK_LENGTH;
    activeCar.group.rotation.set(0, 0, 0);
    activeCar.wheels.forEach(w => { w.rotation.x += dt * 15; });

    if (Math.random() < 0.45) {
      const backOffset = new THREE.Vector3(0, 0.3, 2.4).applyQuaternion(activeCar.group.quaternion);
      const sparkPos = activeCar.group.position.clone().add(backOffset);
      sparkPos.y += Math.random() * 0.4;
      emitSpark(sparkPos, Math.random() > 0.7 ? 'cyan' : null);
    }
    raceProgress.style.width = (carProgress * 100) + '%';
    const displaySpeed = Math.round(currentSpeed * 24 * 320);
    hudSpeed.textContent = displaySpeed + ' KM/H';
  } else if (activeCar && raceFinished) {
    activeCar.group.position.y = 0.1 + Math.sin(time * 20) * 0.03;
    activeCar.group.rotation.y += dt * 0.8;
    activeCar.wheels.forEach(w => { w.rotation.x += dt * 8; });
    hudSpeed.textContent = '0 KM/H';

    // 🔧 CAMBIO 5: Luces más fuertes al llegar (3.0 + 3.0 + 2.0)
    const cp = activeCar.group.position;
    carKeyLight.position.set(cp.x + 3, cp.y + 6, cp.z + 4);
    carKeyLight.intensity = 3.0;
    carRimLight.position.set(cp.x - 4, cp.y + 2, cp.z - 3);
    carRimLight.intensity = 3.0;
    carWarmLight.position.set(cp.x + 3, cp.y + 1, cp.z - 4);
    carWarmLight.intensity = 2.0;
  }

  if (activeCar && phase3 && !phase3.classList.contains('hidden')) {
    const carPos = activeCar.group.position;
    const desiredCamPos = new THREE.Vector3(carPos.x, carPos.y + 5, carPos.z + 10);
    const camLerp = 1 - Math.pow(0.001, dt);
    camera.position.lerp(desiredCamPos, camLerp);
    const desiredLook = new THREE.Vector3(carPos.x, carPos.y + 0.8, carPos.z - 8);
    camera.lookAt(desiredLook);
    const targetFov = 65 + (currentSpeed / TARGET_SPEED) * 8;
    camera.fov += (targetFov - camera.fov) * 0.05;
    camera.updateProjectionMatrix();
  }

  sparkPool.forEach(spark => {
    if (spark.visible) {
      spark.userData.life -= dt;
      if (spark.userData.life <= 0) {
        spark.visible = false;
        spark.material.opacity = 0;
      } else {
        spark.material.opacity = Math.max(0, spark.userData.life / 0.45);
        spark.position.add(spark.userData.vel.clone().multiplyScalar(dt * 60));
        spark.userData.vel.y -= dt * 1.5;
        const s = spark.userData.life * 1.2;
        spark.scale.setScalar(Math.max(0.15, s));
      }
    }
  });

  // 🔧 CAMBIO 4: Bloom subido a 0.75 durante/después de la carrera
  bloom.strength = raceActive ? 0.75 : 1.0;

  if (controls.enabled) controls.update();
  composer.render();
}
animate();

// ============ INICIAR CARGA ============
totalToLoad = CARS.length;
Promise.all(CARS.map(car => loadModel(car)))
  .then(() => {
    console.log('✅ Todos los modelos cargados:', loadedCount);
    buildGalaxy();
    createSpeedLines();
  })
  .catch(err => {
    console.error('❌ Error en carga:', err);
    if (loaderEl) loaderEl.classList.add('hidden');
    if (galaxyGroup.children.length === 0) { buildGalaxy(); createSpeedLines(); }
  });

setTimeout(() => {
  if (loaderEl && !loaderEl.classList.contains('hidden')) {
    loaderEl.classList.add('hidden');
    if (galaxyGroup.children.length === 0) { buildGalaxy(); createSpeedLines(); }
  }
}, 15000);

// ============ EVENTOS ============
startBtn.addEventListener('click', () => {
  initAudio();
  playWarp();
  warpOverlay.classList.add('active');
  warpRays.classList.add('active');
  speedFlash.classList.add('active');
  setTimeout(() => speedFlash.classList.remove('active'), 500);
  phase1.classList.add('hidden');
  setTimeout(() => {
    sceneContainerEl.classList.remove('hidden-until-start');
    phase2.classList.remove('hidden');
    speedLinesBg.classList.add('active');
    playEngine();
    camera.position.set(0, 10, 32);
    controls.target.set(0, 0, 0);
    controls.enabled = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.4;
    controls.update();

    const t0 = performance.now();
    const startZ = 60, endZ = 32;
    const startFov = 40, endFov = 65;
    function zoomIn() {
      const t = Math.min((performance.now() - t0) / 1400, 1);
      const ease = 1 - Math.pow(1 - t, 3);
      camera.position.z = startZ + (endZ - startZ) * ease;
      camera.fov = startFov + (endFov - startFov) * ease;
      camera.updateProjectionMatrix();
      if (t < 1) requestAnimationFrame(zoomIn);
    }
    zoomIn();
  }, 350);

  setTimeout(() => {
    warpOverlay.classList.remove('active');
    warpRays.classList.remove('active');
  }, 1500);
});

repeatBtn.addEventListener('click', () => {
  speedLinesBg.classList.remove('active');
  closeModelViewer();
  startRace(activeCarType);
});

garageBtn.addEventListener('click', () => {
  removeActiveCar();
  closeModelViewer();
  raceActive = false;
  raceFinished = false;
  currentSpeed = 0;
  phraseActive = false;
  raceSubtitle.classList.remove('visible');
  phase4.classList.add('hidden');
  phase2.classList.remove('hidden');
  speedLinesBg.classList.add('active');
  skipBtn.classList.remove('show');
  scene.fog = new THREE.FogExp2(0x03030a, 0.0065);
  camera.position.set(0, 10, 32);
  controls.target.set(0, 0, 0);
  controls.enabled = true;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.4;
  controls.update();
});

skipBtn.addEventListener('click', () => {
  if (raceActive) {
    carProgress = 0.99;
    phraseActive = false;
    raceSubtitle.classList.remove('visible');
  }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  if (viewerRenderer && viewerCamera) {
    const w = modelViewerEl.clientWidth;
    const h = modelViewerEl.clientHeight;
    viewerCamera.aspect = w / h;
    viewerCamera.updateProjectionMatrix();
    viewerRenderer.setSize(w, h);
  }
});
</script>
