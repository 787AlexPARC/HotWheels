<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>SPEED OF LOVE · 3D Hot Wheels Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#000;
    font-family:'Orbitron', sans-serif; color:#fff;
    touch-action:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
  }
  #scene-container { position:fixed; inset:0; z-index:1; }
  #scene-container canvas { display:block; width:100% !important; height:100% !important; }

  .vignette { position:fixed; inset:0; z-index:2; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%); mix-blend-mode:multiply; }
  .speed-flash { position:fixed; inset:0; z-index:60; pointer-events:none;
    background:radial-gradient(circle, #fff 0%, #ff7700 40%, transparent 70%);
    opacity:0; transition:opacity 0.15s; }
  .speed-flash.active { opacity:0.95; animation:flashOut 0.5s forwards; }
  @keyframes flashOut { 0%{opacity:0.95;} 100%{opacity:0;} }

  .phase { position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    transition:opacity 0.6s ease, visibility 0.6s;
    background:rgba(0,0,0,0.55);
    padding:1rem;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .phase.hidden { opacity:0; visibility:hidden; pointer-events:none; }

  #phase1 { background:radial-gradient(ellipse at center, rgba(0,0,0,0.3), rgba(0,0,0,0.9)); }
  #phase1 h1 { font-size:clamp(2rem, 10vw, 5.5rem); font-weight:900; letter-spacing:0.12em;
    background:linear-gradient(90deg, #ff7b00, #ffcc00, #00c8ff, #ff7b00);
    background-size:300% 100%; -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 25px rgba(255,120,0,0.9));
    animation:gradientMove 4s linear infinite; text-align:center; }
  @keyframes gradientMove { 0%{background-position:0% 50%;} 100%{background-position:300% 50%;} }
  #phase1 .subtitle { font-size:clamp(0.7rem, 3vw, 1.3rem); color:#ddd; letter-spacing:0.2em;
    margin-top:1rem; margin-bottom:2.5rem; text-transform:uppercase; text-shadow:0 0 15px #ff7700;
    text-align:center; padding:0 1rem; }
  .main-car-icon { font-size:clamp(3rem, 15vw, 8rem); margin-bottom:1.5rem;
    animation:sway 2s infinite ease-in-out; filter:drop-shadow(0 0 30px #ff9900); }
  @keyframes sway { 0%,100% { transform:translateX(-10px) rotate(-1deg); } 50% { transform:translateX(10px) rotate(1deg); } }
  .start-btn { padding:1.2rem 2.5rem; font-family:'Orbitron', sans-serif; font-size:clamp(0.9rem,4vw,1.6rem); font-weight:900;
    letter-spacing:0.15em; text-transform:uppercase; cursor:pointer; color:#000;
    border:2px solid #ffcc00; border-radius:60px;
    background:linear-gradient(45deg, #ff4500, #ffaa00);
    box-shadow:0 0 30px #ff6600, 0 0 60px #ff4500, inset 0 0 20px rgba(255,255,255,0.4);
    transition:transform 0.15s; animation:btnPulse 1.4s infinite alternate;
    touch-action:manipulation; }
  .start-btn:hover { transform:scale(1.06); }
  .start-btn:active { transform:scale(0.95); }
  @keyframes btnPulse { from { box-shadow:0 0 20px #ff6600, 0 0 40px #ff4500; }
    to { box-shadow:0 0 45px #ffcc00, 0 0 90px #ff6600; } }

  #phase2 h2 { font-size:clamp(1.5rem, 7vw, 3rem); color:#ffaa00; letter-spacing:0.15em;
    text-shadow:0 0 30px #ff5500; margin-bottom:0.6rem; text-align:center; }
  #phase2 .garage-sub { font-size:clamp(0.6rem, 2.5vw, 0.8rem); color:#888; letter-spacing:0.2em;
    margin-bottom:1rem; text-transform:uppercase; text-align:center; }

  .garage-grid { display:flex; flex-wrap:wrap; justify-content:center; gap:1rem;
    padding:0 1rem 2rem; max-width:1250px; width:100%; }

  .car-card { width:clamp(140px, 44vw, 200px); padding:0.8rem 0.6rem; border-radius:20px;
    background:linear-gradient(160deg, #141414, #050505);
    border:2px solid #333; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    transition:transform 0.3s, box-shadow 0.3s, border-color 0.3s;
    position:relative; overflow:hidden;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent; }
  .car-card::before { content:''; position:absolute; inset:-2px; border-radius:20px;
    padding:2px; background:linear-gradient(120deg, transparent, currentColor, transparent);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; opacity:0; transition:opacity 0.3s; }
  .car-card:hover::before { opacity:1; }
  .car-card:hover { transform:translateY(-10px) scale(1.03);
    box-shadow:0 20px 40px -12px currentColor, 0 0 40px -5px currentColor; }
  .car-card:active { transform:scale(0.96); }
  .car-card .preview-box {
    width:100%; height:clamp(70px, 22vw, 95px); margin-bottom:0.4rem;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, rgba(255,255,255,0.06), transparent 70%);
    border-radius:14px;
    overflow:hidden;
    position:relative;
  }
  .car-card .preview-box img {
    max-width:90%;
    max-height:90%;
    width:auto;
    height:auto;
    object-fit:contain;
    filter:drop-shadow(0 0 10px currentColor);
    transition:transform 0.3s;
    display:block;
  }
  .car-card:hover .preview-box img {
    transform:scale(1.12) rotate(-3deg);
  }
  .car-card .preview-box .fallback-emoji {
    font-size: clamp(2.5rem, 12vw, 4rem);
    line-height:1;
    filter: drop-shadow(0 0 15px currentColor);
  }
  .car-card h3 { font-size:clamp(0.7rem, 3vw, 0.95rem); margin-bottom:0.2rem; color:#fff; letter-spacing:0.05em; }
  .car-card p { font-size:clamp(0.5rem, 2vw, 0.6rem); color:#aaa; line-height:1.3; letter-spacing:0.02em; }
  .car-card .glb-name { font-size:clamp(0.4rem, 1.6vw, 0.5rem); color:#555; margin-top:0.3rem; font-family:monospace; }

  #phase3 { background:transparent; backdrop-filter:none;
    justify-content:flex-start; padding:0; padding-top:3vh; pointer-events:none; opacity:1; }
  #phase3.hidden { opacity:0; visibility:hidden; }
  .hud-top { display:flex; justify-content:space-between; align-items:center;
    width:95%; max-width:1100px; pointer-events:none; padding:0 0.5rem; }
  .hud-lap { font-size:clamp(0.6rem, 2.5vw, 1.1rem); letter-spacing:0.15em; color:#ffaa00;
    text-shadow:0 0 15px #ff5500; background:rgba(0,0,0,0.5);
    padding:0.4rem 0.8rem; border-radius:40px; border:1px solid #ff7700aa;
    white-space:nowrap; }
  .hud-speed { font-size:clamp(0.6rem, 2.5vw, 1.1rem); letter-spacing:0.12em; color:#00e0ff;
    text-shadow:0 0 15px #00aaff; background:rgba(0,0,0,0.5);
    padding:0.4rem 0.8rem; border-radius:40px; border:1px solid #00aaffaa;
    white-space:nowrap; }
  .race-subtitle-wrap { position:absolute; top:22%; left:0; right:0;
    display:flex; justify-content:center; pointer-events:none; padding:0 0.8rem; }
  .race-subtitle { font-size:clamp(0.9rem, 4vw, 2.2rem); font-weight:900; letter-spacing:0.02em;
    text-align:center; padding:0.6rem 1.2rem; border-radius:30px;
    background:rgba(0,0,0,0.7); border-left:5px solid #ff7700; border-right:5px solid #ff7700;
    white-space:normal; max-width:95vw; line-height:1.25;
    animation:subtitlePop 0.5s ease-out; opacity:0; transition:opacity 0.3s; }
  .race-subtitle.visible { opacity:1; }
  @keyframes subtitlePop { 0% { transform:scale(0.4); opacity:0; filter:blur(8px); }
    70% { transform:scale(1.08); opacity:1; filter:blur(0); } 100% { transform:scale(1); } }
  .race-progress-wrap { position:absolute; bottom:5vh; left:50%; transform:translateX(-50%);
    width:80%; max-width:700px; height:8px; border-radius:8px;
    background:rgba(255,255,255,0.12); overflow:hidden; border:1px solid #ff770055; }
  .race-progress { height:100%; width:0%;
    background:linear-gradient(90deg, #ff7700, #ffcc00);
    box-shadow:0 0 20px #ffaa00, 0 0 40px #ff6600; transition:width 0.2s linear; }

  #phase4 { background:rgba(0,0,0,0.8); }
  .letter-card { width:min(92vw, 640px); padding:clamp(1.5rem, 5vw, 2.6rem); border-radius:24px;
    background:linear-gradient(160deg, #121212, #050505);
    border:3px solid #ffaa00; text-align:center;
    animation:cardIn 0.7s cubic-bezier(.2,.9,.3,1.3); position:relative;
    max-height:90vh; overflow-y:auto;
    -webkit-overflow-scrolling:touch; }
  @keyframes cardIn { 0% { transform:scale(0.6) translateY(40px) rotateX(15deg); opacity:0; }
    100% { transform:scale(1) translateY(0) rotateX(0); opacity:1; } }
  .letter-card h2 { font-size:clamp(1rem, 4vw, 2rem); margin-bottom:1rem; letter-spacing:0.05em;
    text-shadow:0 0 20px currentColor; }
  .letter-card p { font-size:clamp(0.75rem, 3vw, 1.1rem); line-height:1.6; color:#ddd;
    margin-bottom:1.5rem; font-weight:400; letter-spacing:0.02em; }
  .letter-buttons { display:flex; gap:0.8rem; justify-content:center; flex-wrap:wrap; }
  .letter-buttons button { font-family:'Orbitron', sans-serif; font-size:clamp(0.7rem, 3vw, 1rem); font-weight:700;
    letter-spacing:0.05em;
    padding:0.7rem 1.4rem; border-radius:50px; cursor:pointer;
    background:transparent; color:#fff; border:2px solid #666; transition:all 0.25s;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent; }
  .letter-buttons button:hover { transform:translateY(-3px); }
  .letter-buttons button:active { transform:scale(0.95); }
  .letter-buttons .repeat-btn { border-color:#ffaa00; color:#ffaa00; }
  .letter-buttons .repeat-btn:hover { box-shadow:0 0 30px #ffaa00; background:rgba(255,170,0,0.1); }
  .letter-buttons .garage-btn { border-color:#00c8ff; color:#00c8ff; }
  .letter-buttons .garage-btn:hover { box-shadow:0 0 30px #00c8ff; background:rgba(0,200,255,0.1); }

  #loader { position:fixed; inset:0; z-index:200; background:#000;
    display:flex; justify-content:center; align-items:center; flex-direction:column; gap:1rem;
    transition:opacity 0.6s; padding:2rem; text-align:center; }
  #loader.hidden { opacity:0; pointer-events:none; }
  .spinner { width:50px; height:50px; border-radius:50%; border:4px solid #222;
    border-top-color:#ff7700; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loader p { color:#ffaa00; letter-spacing:0.2em; font-size:clamp(0.7rem, 3vw, 0.9rem); }
  #loader .progress-text { color:#888; font-size:0.7rem; letter-spacing:0.15em; }
  #loader .device-info { color:#555; font-size:0.6rem; letter-spacing:0.1em; margin-top:0.5rem; }
  .progress-bar-wrap { width:min(300px, 80vw); height:6px; background:#222; border-radius:3px; overflow:hidden; }
  .progress-bar { height:100%; width:0%; background:linear-gradient(90deg,#ff7700,#ffcc00);
    box-shadow:0 0 12px #ffaa00; transition:width 0.2s; }

  .skip-btn { position:fixed; bottom:15px; right:15px; z-index:50;
    background:rgba(0,0,0,0.7); color:#ffaa00; border:1px solid #ff7700;
    font-family:'Orbitron', sans-serif; padding:0.5rem 0.9rem; border-radius:40px; cursor:pointer;
    font-size:clamp(0.6rem, 2.5vw, 0.8rem); letter-spacing:0.1em; opacity:0; transition:opacity 0.3s;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent; }
  .skip-btn.show { opacity:1; }
  .skip-btn:active { transform:scale(0.95); }

  .rotate-hint {
    position:fixed; bottom:10px; left:50%; transform:translateX(-50%);
    color:#ffaa00; font-size:0.6rem; letter-spacing:0.15em;
    background:rgba(0,0,0,0.7); padding:0.3rem 0.8rem; border-radius:20px;
    border:1px solid #ff770055; z-index:40;
    opacity:0; transition:opacity 0.3s; pointer-events:none;
  }
  .rotate-hint.show { opacity:1; }
</style>
</head>
<body>

  <div id="scene-container"></div>
  <div class="vignette"></div>
  <div class="speed-flash" id="speedFlash"></div>

  <div id="loader">
    <div class="spinner"></div>
    <p>CARGANDO MODELOS 3D...</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="loadProgress"></div></div>
    <div class="progress-text" id="loadText">0%</div>
    <div class="device-info" id="deviceInfo">Detectando dispositivo...</div>
  </div>

  <div id="phase1" class="phase">
    <h1>SPEED OF LOVE</h1>
    <div class="subtitle">Presiona para arrancar juntos este viaje</div>
    <div class="main-car-icon">🏎️💨</div>
    <button id="startBtn" class="start-btn">Acelerar 🔥</button>
  </div>

  <div id="phase2" class="phase hidden">
    <h2>EL GARAGE</h2>
    <div class="garage-sub">Elige tu Hot Wheels favorito</div>
    <div class="garage-grid" id="garageGrid"></div>
  </div>

  <div id="phase3" class="phase hidden">
    <div class="hud-top">
      <div class="hud-lap" id="hudLap">CARRERA EN VIVO</div>
      <div class="hud-speed" id="hudSpeed">0 KM/H</div>
    </div>
    <div class="race-subtitle-wrap">
      <div id="raceSubtitle" class="race-subtitle"></div>
    </div>
    <div class="race-progress-wrap">
      <div id="raceProgress" class="race-progress"></div>
    </div>
  </div>

  <div id="phase4" class="phase hidden">
    <div id="letterCard" class="letter-card">
      <h2 id="letterTitle">Para ti</h2>
      <p id="letterBody">...</p>
      <div class="letter-buttons">
        <button id="repeatBtn" class="repeat-btn"> Repetir carrera</button>
        <button id="garageBtn" class="garage-btn"> Elegir otro auto</button>
      </div>
    </div>
  </div>

  <button id="skipBtn" class="skip-btn">Saltar ⏭</button>
  <div class="rotate-hint" id="rotateHint">📱 Gira el teléfono</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // ========================================================
    // 📱 DETECCIÓN DE DISPOSITIVO Y AJUSTES RESPONSIVE
    // ========================================================
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
                     || (window.innerWidth < 768);
    const isLowPower = isMobile && window.innerWidth < 500;
    const isTablet = !isMobile && window.innerWidth < 1024;

    const SETTINGS = {
      pixelRatio: isMobile ? Math.min(window.devicePixelRatio, 1.5) : Math.min(window.devicePixelRatio, 2),
      shadowsEnabled: !isMobile,
      bloomStrength: isMobile ? 0.5 : 0.9,
      segmentCount: isMobile ? 300 : (isTablet ? 450 : 600),
      starCount: isMobile ? 400 : (isTablet ? 700 : 1000),
      sparkPoolSize: isMobile ? 40 : 120,
      targetLength: isMobile ? 4.5 : 5.0,
      phraseDuration: isMobile ? 4.0 : 4.5,
      targetSpeed: isMobile ? 1/22 : 1/24,
      camDist: isMobile ? 12 : 11,
      camHeight: isMobile ? 6 : 5.5
    };

    document.getElementById('deviceInfo').textContent =
      isMobile ? (isLowPower ? 'Modo móvil (baja potencia)' : 'Modo móvil') :
      isTablet ? 'Modo tablet' : 'Modo escritorio';

    // ========================================================
    // 🚗  TUS 9 COCHES — con propiedad "image" para las previews
    // ========================================================
    // 🖼️ PON TUS IMÁGENES EN LA MISMA CARPETA QUE EL index.html
    //    Ejemplo: raptor.png, kitt.png, jackhammer.png, etc.
    //    Si la imagen no existe, se muestra un emoji como fallback.
    // ========================================================
    const CARS = [
      { id: 'raptor', file: 'raptor.glb', image: 'raptor.png', name: 'FORD F-150 RAPTOR', desc: 'Camioneta Todoterreno · Un amor que lo supera todo', color: 0xffffff, rotationY: Math.PI, emoji: '🛻',
      phrases: ["Contigo no existen caminos difíciles ni baches que nos puedan frenar. 🏔️", "Este motor ruge fuerte, pero mi corazón late más rápido cuando te subes.", "Me encanta cómo se siente el viaje cuando tú eres quien maneja mi vida.", "Eres la única persona capaz de hacerme sentir a salvo en cualquier terreno.", "Aunque tengamos tracción en las cuatro ruedas, tú eres mi único agarre seguro.", "Contigo iría hasta el fin del mundo, sin importar si hay carretera o no. ✨", "Llegamos a la meta, pero este viaje todoterreno a tu lado apenas empieza. 🖤"],
        letterTitle: "Raptor · Un amor que lo supera todo", letterBody: "Escribo esto pensando en la fuerza y la seguridad que me transmites cada día. Eres como una Raptor: imponente por fuera, pero el lugar más cómodo y seguro para mí por dentro. Me encanta que no le tengas miedo a los caminos difíciles, que conviertas cualquier obstáculo en una aventura y que siempre encuentres la manera de hacerme sonreír en las curvas de la vida. Gracias por ser mi compañero de ruta, mi protector y mi aventura favorita a cuatro ruedas. Te quiero más de lo que cualquier motor de alta potencia podría llegar a demostrar en toda una vida. 🖤" },
      { id: 'kitt', file: 'kitt.glb', image: 'kitt.png', name: 'K.I.T.T. (Pontiac Firebird)', desc: 'Deportivo Inteligente · Un amor con IA', color: 0xffffff, rotationY: Math.PI, emoji: '🚗',
        phrases: ["Mi escáner frontal parpadea en rojo cada vez que te acercas... es mi forma de latir. ❤️‍🔥", "No necesito activar el modo de conducción autónoma si el destino siempre eres tú.", "Aceleremos a fondo con el Turbo Boost, mi corazón va a mil por hora contigo.", "Eres la única persona capaz de tomar el control de mis sistemas sin hackearme.", "Incluso la computadora más avanzada del mundo se queda sin palabras al mirarte.", "Viajar en el tiempo o recorrer carreteras vacías... da igual el rumbo si es a tu lado. ✨", "Llegamos al final de la ruta, pero nuestro viaje apenas está comenzando. 🖤"],
        letterTitle: "K.I.T.T. · Un amor con inteligencia artificial", letterBody: "Escribo esto procesando cada milisegundo que pasamos juntos, guardando cada sonrisa tuya en mi banco de memoria central. Llegaste a mi vida para demostrarme que, detrás de toda mi carrocería blindada y mis sistemas avanzados, hay un motor que ruge con fuerza solo por ti. Contigo aprendí que el viaje más emocionante no se mide en caballos de fuerza ni en velocidad máxima, sino en la tranquilidad de ir en el asiento de al lado compartiendo el mismo camino. Te quiero más de lo que cualquier software o velocímetro podría llegar a calcular en toda una eternidad. 🖤" },
      { id: 'jackhammer', file: 'jackhammer.glb', image: 'jackhammer.png', name: 'JACK HAMMER', desc: 'Deportivo · Un amor puro y celestial', color: 0xd0d8e0, rotationY: Math.PI, emoji: '🏎️',
        phrases: ["Oye... cuando te vi llegar con este coche, sentí que algo bonito empezaba ✨","Eres mi ángel de la guarda con ruedas, ¿lo sabías?","Cada vez que aceleras, mi corazón hace lo mismo pero más rápido.","Me encanta cómo me miras cuando crees que no me doy cuenta.","Contigo hasta el silencio se siente como música de fondo.","Si pudiera pedir un deseo, sería más tardes así, contigo.","Llegamos a la meta, pero mi amor por ti no se detiene nunca. 🤍"],
        letterTitle: "Jack Hammer · Un amor celestial", letterBody: "Escribo esto mientras pienso en todas las veces que me has hecho sonreír sin darte cuenta. Eres esa persona que llegó a mi vida como un ángel con ruedas, sin avisar y sin hacer ruido. Contigo aprendí que el amor más bonito es el que se siente tranquilo, seguro, como un motor que ronronea suave. Gracias por cada mirada, por cada silencio cómodo, por cada carcajada a 200 por hora. Te quiero más de lo que este velocímetro puede marcar. 🤍" },
      { id: 'chevrolet', file: 'chevrolet.glb', image: 'chevrolet.png', name: 'CHEVROLET', desc: 'Muscle Car Azul · Fuerza que enamora', color: 0x2266dd, rotationY: Math.PI, emoji: '🚙',

    // ============ AUDIO ============
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch(e) { return; }
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playEngine() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(80, now);
        osc.frequency.linearRampToValueAtTime(240, now + 0.5);
        osc.frequency.linearRampToValueAtTime(130, now + 1.0);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0.2, now + 0.2);
        gain.gain.linearRampToValueAtTime(0, now + 1.2);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 1.2);
      } catch(e) {}
    }
    function playScreech() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(900, now);
        osc.frequency.exponentialRampToValueAtTime(280, now + 0.5);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.6);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.6);
      } catch(e) {}
    }
    function playBlip() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(660, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.15);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.15);
      } catch(e) {}
    }

    // ============ THREE.JS SETUP ============
    const container = document.getElementById('scene-container');

    container.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);

    const bloom = new UnrealBloomPass(

    // ========================================================
    // 🛣️  PISTA RECTA
    // ========================================================
    const TRACK_LENGTH = 800;
    const trackCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 0, -TRACK_LENGTH * 0.25),
      new THREE.Vector3(0, 0, -TRACK_LENGTH * 0.5),
      new THREE.Vector3(0, 0, -TRACK_LENGTH * 0.75),
      new THREE.Vector3(0, 0, -TRACK_LENGTH),
    ], false, 'catmullrom', 0.5);

    const trackWidth = 13;
    const N = SETTINGS.segmentCount;
    const trackGeo = new THREE.BufferGeometry();
    const positions = [];
    const indices = [];
    const uvs = [];

    const pt = new THREE.Vector3();
    const tangent = new THREE.Vector3();
    const up = new THREE.Vector3(0,1,0);
    const side = new THREE.Vector3();

    for (let i = 0; i <= N; i++) {
      const t = i / N;
      trackCurve.getPointAt(t, pt);
      trackCurve.getTangentAt(t, tangent).normalize();
      side.crossVectors(tangent, up).normalize().multiplyScalar(trackWidth/2);
      positions.push(pt.x - side.x, pt.y, pt.z - side.z);
      positions.push(pt.x + side.x, pt.y, pt.z + side.z);
      uvs.push(0, t*40);
      uvs.push(1, t*40);
      if (i < N) {
        const a = i*2, b = i*2+1, c = (i+1)*2, d = (i+1)*2+1;
        indices.push(a, c, b);
        indices.push(b, c, d);
      }
    }
    trackGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
    trackGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs,2));
    trackGeo.setIndex(indices);
    trackGeo.computeVertexNormals();

    const trackMat = new THREE.MeshStandardMaterial({
      color: 0x1a1a1a, roughness: 0.85, metalness: 0.2,
      emissive: 0x221100, emissiveIntensity: 0.3
    });
    const trackMesh = new THREE.Mesh(trackGeo, trackMat);
    if (SETTINGS.shadowsEnabled) trackMesh.receiveShadow = true;
    scene.add(trackMesh);

    function createNeonRail(offset) {
      const railPoints = [];
      const railSegments = isMobile ? 100 : 300;
      for (let i = 0; i <= railSegments; i++) {
        const t = i / railSegments;
        const p = trackCurve.getPointAt(t, new THREE.Vector3());
        const tg = trackCurve.getTangentAt(t, new THREE.Vector3()).normalize();
        const sd = new THREE.Vector3().crossVectors(tg, new THREE.Vector3(0,1,0)).normalize().multiplyScalar(offset);
        railPoints.push(new THREE.Vector3(p.x + sd.x, 0.15, p.z + sd.z));
      }
      const railCurve = new THREE.CatmullRomCurve3(railPoints, false);
      const railGeo = new THREE.TubeGeometry(railCurve, railSegments, 0.2, isMobile ? 4 : 8, false);
      const railMat = new THREE.MeshStandardMaterial({
        color: offset > 0 ? 0x00c8ff : 0xff7700,
        emissive: offset > 0 ? 0x00c8ff : 0xff7700,
        emissiveIntensity: 2.5, roughness: 0.3, metalness: 0.4
      });
      return new THREE.Mesh(railGeo, railMat);
    }
    scene.add(createNeonRail(trackWidth/2 + 0.2));
    scene.add(createNeonRail(-trackWidth/2 - 0.2));

    const centerLineGeo = new THREE.BufferGeometry();
    const centerPositions = [];
    const centerSegs = isMobile ? 400 : 1200;
    for (let i = 0; i < centerSegs; i++) {
      if (i % 8 < 4) {
        const t1 = i/centerSegs, t2 = (i+1)/centerSegs;
        const p1 = trackCurve.getPointAt(t1, new THREE.Vector3());
        const p2 = trackCurve.getPointAt(t2, new THREE.Vector3());
        centerPositions.push(p1.x, 0.05, p1.z, p2.x, 0.05, p2.z);
      }
    }
    centerLineGeo.setAttribute('position', new THREE.Float32BufferAttribute(centerPositions, 3));
    const centerLine = new THREE.LineSegments(centerLineGeo, new THREE.LineBasicMaterial({

    }));

    const metaGeo = new THREE.PlaneGeometry(trackWidth + 2, 1.2);
    const metaMat = new THREE.MeshBasicMaterial({ color: 0xffcc00, side: THREE.DoubleSide });
    const metaMesh = new THREE.Mesh(metaGeo, metaMat);
    metaMesh.rotation.x = -Math.PI/2;
    metaMesh.position.set(0, 0.06, -TRACK_LENGTH);
    scene.add(metaMesh);

    const checkerGeo = new THREE.PlaneGeometry(trackWidth + 2, 3);
    const checkerCanvas = document.createElement('canvas');
    checkerCanvas.width = 64;
    checkerCanvas.height = 16;
    const cctx = checkerCanvas.getContext('2d');
    for (let y = 0; y < 2; y++) {
      for (let x = 0; x < 8; x++) {
        cctx.fillStyle = (x + y) % 2 === 0 ? '#ffffff' : '#000000';
        cctx.fillRect(x * 8, y * 8, 8, 8);

    }
    const checkerTex = new THREE.CanvasTexture(checkerCanvas);
    const checkerMat = new THREE.MeshBasicMaterial({ map: checkerTex, side: THREE.DoubleSide });
    const checkerMesh = new THREE.Mesh(checkerGeo, checkerMat);
    checkerMesh.rotation.x = -Math.PI/2;
    checkerMesh.position.set(0, 0.07, -TRACK_LENGTH + 2);
    scene.add(checkerMesh);

    const grid = new THREE.GridHelper(isMobile ? 600 : 1400, isMobile ? 60 : 140, 0x222222, 0x111111);
    grid.position.y = -0.5;
    grid.position.z = -TRACK_LENGTH / 2;
    scene.add(grid);

    const groundMat = new THREE.MeshStandardMaterial({ color:0x050505, roughness:0.4, metalness:0.6 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400), groundMat);
    ground.rotation.x = -Math.PI/2;
    ground.position.y = -0.6;
    ground.position.z = -TRACK_LENGTH / 2;

    const starsGeo = new THREE.BufferGeometry();

    // ============ LOADER GLB ============

    function updateLoadProgress() {
      if (totalToLoad === 0) {
        loaderEl.classList.add('hidden');
        return;
      }
      const pct = Math.round((loadedCount / totalToLoad) * 100);
      loadProgressEl.style.width = pct + '%';
      loadTextEl.textContent = pct + '%';
      if (loadedCount >= totalToLoad) {
        setTimeout(() => loaderEl.classList.add('hidden'), 400);
      }
    }

    function processModel(model, car) {
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = TARGET_LENGTH / maxDim;
      model.scale.setScalar(scale);

      const box2 = new THREE.Box3().setFromObject(model);
      const center2 = box2.getCenter(new THREE.Vector3());
      const min2 = box2.min;

      model.position.x -= center2.x;
      model.position.z -= center2.z;
      model.position.y -= min2.y;

      model.traverse(child => {
        if (child.isMesh) {
          if (SETTINGS.shadowsEnabled) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        }
      });

      return { model, size: size.clone().multiplyScalar(scale) };
    }

    function loadModel(car) {
      return new Promise((resolve) => {
        gltfLoader.load(car.file, (gltf) => {
          const result = processModel(gltf.scene, car);
          modelCache[car.id] = {
            scene: result.model,
            size: result.size,
            rotationY: car.rotationY || 0,
            carData: car
          };
          loadedCount++;
          updateLoadProgress();
          resolve(modelCache[car.id]);
        },
        undefined,
        (err) => {
          console.warn('Error cargando', car.file, '— usando placeholder');
          const geo = new THREE.BoxGeometry(2.4, 1.5, 5);
          const mat = new THREE.MeshStandardMaterial({
            color: car.color, emissive: car.color, emissiveIntensity: 0.4,
            roughness: 0.4, metalness: 0.6
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.y = 0.75;
          const group = new THREE.Group();
          group.add(mesh);
          modelCache[car.id] = {
            scene: group,
            rotationY: car.rotationY || 0,
            carData: car
          };
          loadedCount++;
          updateLoadProgress();
          resolve(modelCache[car.id]);
        });
      });
    }

    // ✅ Carga en serie (uno por uno) — mejor para móvil

        card.dataset.car = car.id;

        card.style.color = colorStr;

        const previewBox = document.createElement('div');
        previewBox.className = 'preview-box';
        previewBox.id = 'preview-' + car.id;
        card.appendChild(previewBox);

        const h3 = document.createElement('h3');
        h3.textContent = car.name;
        card.appendChild(h3);

        const p = document.createElement('p');
        p.textContent = car.desc;
        card.appendChild(p);

        const glbName = document.createElement('div');
        glbName.className = 'glb-name';
        glbName.textContent = car.file;
        card.appendChild(glbName);

        const handleSelect = (e) => {
          e.preventDefault();
          initAudio();
          startRace(car.id);
        };
        card.addEventListener('click', handleSelect);
        card.addEventListener('touchend', handleSelect, { passive: false });

        grid.appendChild(card);
      });

      // ✅ Generar previews con imágenes
      generatePreviews();
    }

    function cloneModelForScene(cached) {
      const clonedScene = cached.scene.clone(true);
      clonedScene.rotation.y = cached.rotationY;
      return clonedScene;
    }

    // ✅ Preview con IMAGEN + fallback a emoji si no existe

        const previewEl = document.getElementById('preview-' + car.id);
        if (!previewEl) return;

        const colorStr = '#' + car.color.toString(16).padStart(6, '0');

        // Si el coche tiene imagen definida, la usamos

          img.style.filter = `drop-shadow(0 0 10px ${colorStr})`;

            previewEl.appendChild(emojiSpan);

          previewEl.appendChild(img);
        } else {

          const emojiSpan = document.createElement('span');

          emojiSpan.style.color = colorStr;

        Math.random()*0.25 + 0.05,
        (Math.random()-0.5)*0.3
      );
      spark.scale.setScalar(1 + Math.random()*1.5);
    }

    // ============ UI ============
    const phase1 = document.getElementById('phase1');
    const phase2 = document.getElementById('phase2');
    const phase3 = document.getElementById('phase3');
    const phase4 = document.getElementById('phase4');
    const startBtn = document.getElementById('startBtn');
    const raceSubtitle = document.getElementById('raceSubtitle');
    const raceProgress = document.getElementById('raceProgress');
    const hudSpeed = document.getElementById('hudSpeed');
    const letterTitle = document.getElementById('letterTitle');
    const letterBody = document.getElementById('letterBody');
    const letterCard = document.getElementById('letterCard');
    const repeatBtn = document.getElementById('repeatBtn');
    const garageBtn = document.getElementById('garageBtn');
    const speedFlash = document.getElementById('speedFlash');
    const skipBtn = document.getElementById('skipBtn');
    const rotateHint = document.getElementById('rotateHint');

    // ============ FUNCIONES ============
    function removeActiveCar() {
      if (activeCar) {
        scene.remove(activeCar.group);
        activeCar = null;
      }
    }

    function startRace(carId) {
      if (!modelCache[carId]) {
        console.warn('Modelo no cargado aún:', carId);
        return;
      }

      activeCarType = carId;
      activeCarData = modelCache[carId].carData;
      carProgress = 0;
      currentSpeed = 0;
      raceActive = true;
      raceFinished = false;

      const phrases = activeCarData.phrases;
      const numPhrases = phrases.length;
      phraseTriggerProgress = phrases.map((_, i) => 0.08 + (i / numPhrases) * 0.80);
      phraseShown = new Array(numPhrases).fill(false);
      phraseTimer = 0;
      phraseActive = false;

      raceSubtitle.classList.remove('visible');
      raceSubtitle.textContent = '';

      removeActiveCar();

      const cached = modelCache[carId];
      const carGroup = new THREE.Group();
      const modelClone = cloneModelForScene(cached);
      carGroup.add(modelClone);

      const wheels = [];
      modelClone.traverse(child => {
        if (child.isMesh) {
          const name = (child.name || '').toLowerCase();
          if (name.includes('wheel') || name.includes('rueda') || name.includes('tire') || name.includes('llanta')) {
            wheels.push(child);
          }
        }
      });

      activeCar = { group: carGroup, wheels };
      scene.add(carGroup);

      carGroup.position.set(0, 0.1, 0);
      carGroup.rotation.set(0, 0, 0);

      camera.position.set(0, SETTINGS.camHeight, SETTINGS.camDist);
      camera.lookAt(0, 0.5, -5);

      phase1.classList.add('hidden');
      phase2.classList.add('hidden');
      phase4.classList.add('hidden');
      phase3.classList.remove('hidden');
      skipBtn.classList.add('show');
      hudSpeed.textContent = '0 KM/H';

      speedFlash.classList.add('active');
      setTimeout(() => speedFlash.classList.remove('active'), 500);
      playEngine();
    }

    function finishRace() {
      raceActive = false;
      raceFinished = true;
      playScreech();
      skipBtn.classList.remove('show');
      raceSubtitle.textContent = '🏁 ¡META! 🏁';
      raceSubtitle.classList.add('visible');
      raceSubtitle.style.color = '#ffaa00';
      raceSubtitle.style.textShadow = '0 0 40px #ffaa00, 0 0 80px #ff4500';

      setTimeout(() => {
        phase3.classList.add('hidden');
        phase4.classList.remove('hidden');
        letterTitle.textContent = activeCarData.letterTitle;
        letterBody.textContent = activeCarData.letterBody;
        const colorStr = '#' + activeCarData.color.toString(16).padStart(6, '0');
        letterCard.style.borderColor = colorStr;
        letterCard.style.boxShadow = `0 0 80px ${colorStr}, 0 0 140px ${colorStr}80`;
        letterTitle.style.color = colorStr;
        letterTitle.style.textShadow = `0 0 20px ${colorStr}`;
      }, 1800);
    }

    function showPhrase(idx) {
      const phrases = activeCarData.phrases;
      if (idx >= phrases.length) return;
      phraseActive = true;
      phraseTimer = PHRASE_DURATION;
      raceSubtitle.textContent = phrases[idx];
      const colorStr = '#' + activeCarData.color.toString(16).padStart(6, '0');
      raceSubtitle.style.color = '#fff';
      raceSubtitle.style.textShadow = `0 0 30px ${colorStr}, 0 0 60px ${colorStr}`;
      raceSubtitle.style.borderLeftColor = colorStr;
      raceSubtitle.style.borderRightColor = colorStr;
      raceSubtitle.classList.add('visible');
      raceSubtitle.style.animation = 'none';
      raceSubtitle.offsetHeight;
      raceSubtitle.style.animation = 'subtitlePop 0.5s ease-out';
      playBlip();
    }

    // ============ ANIMACIÓN ============
    const clock = new THREE.Clock();
    let isPaused = false;

    function animate() {
      requestAnimationFrame(animate);
      if (isPaused) return;

      const dt = Math.min(clock.getDelta(), 0.05);
      const time = clock.elapsedTime;

      neonLights.forEach((l, i) => {
        l.position.set(
          Math.sin(time * 0.8 + i) * 30,
          3 + Math.sin(time * 2 + i) * 1.5,
          -carProgress * TRACK_LENGTH + Math.cos(time * 0.6 + i) * 20
        );
        l.intensity = (isMobile ? 1.5 : 2) + Math.sin(time * 5 + i) * 1;
      });
      stars.rotation.y += dt * 0.005;

      if (activeCar && raceActive) {
        if (!phraseActive) {
          currentSpeed += (TARGET_SPEED - currentSpeed) * 0.4 * dt;
        } else {
          currentSpeed += (TARGET_SPEED * 0.35 - currentSpeed) * 0.8 * dt;
        }

        carProgress += currentSpeed * dt;
        if (carProgress >= 1) {
          carProgress = 1;
          if (!raceFinished) finishRace();
        }

        if (phraseActive) {
          phraseTimer -= dt;
          if (phraseTimer <= 0) {
            phraseActive = false;
            raceSubtitle.classList.remove('visible');
          }
        }

        if (!phraseActive && !raceFinished) {
          for (let i = 0; i < phraseTriggerProgress.length; i++) {
            if (!phraseShown[i] && carProgress >= phraseTriggerProgress[i]) {
              phraseShown[i] = true;
              showPhrase(i);
              break;
            }
          }
        }

        const bump = Math.sin(carProgress * 80) * 0.05;
        activeCar.group.position.x = 0;
        activeCar.group.position.y = 0.1 + bump + Math.sin(time * 55) * 0.015;
        activeCar.group.position.z = -carProgress * TRACK_LENGTH;
        activeCar.group.rotation.set(0, 0, 0);

        activeCar.wheels.forEach(w => {
          w.rotation.x += dt * 15;
        });

        if (Math.random() < 0.55) {
          const sparkPos = new THREE.Vector3(
            activeCar.group.position.x,
            activeCar.group.position.y + 0.3,
            activeCar.group.position.z + 2.4
          );
          emitSpark(sparkPos);
        }

        raceProgress.style.width = (carProgress * 100) + '%';
        const displaySpeed = Math.round(currentSpeed * 24 * 320);
        hudSpeed.textContent = displaySpeed + ' KM/H';

      } else if (activeCar && raceFinished) {
        activeCar.group.position.y = 0.1 + Math.sin(time * 20) * 0.03;
        activeCar.group.rotation.y += dt * 0.8;
        activeCar.wheels.forEach(w => { w.rotation.x += dt * 8; });
        hudSpeed.textContent = '0 KM/H';
      }

      if (activeCar) {
        const carPos = activeCar.group.position;

        const desiredCamPos = new THREE.Vector3(
          carPos.x,
          carPos.y + SETTINGS.camHeight,
          carPos.z + SETTINGS.camDist
        );
        const camLerp = 1 - Math.pow(0.001, dt);
        camera.position.lerp(desiredCamPos, camLerp);

        const desiredLook = new THREE.Vector3(
          carPos.x,
          carPos.y + 0.8,
          carPos.z - 8
        );
        camera.lookAt(desiredLook);

        const targetFov = 65 + (currentSpeed / TARGET_SPEED) * 8;
        camera.fov += (targetFov - camera.fov) * 0.05;
        camera.updateProjectionMatrix();
      }

      sparkPool.forEach(spark => {
        if (spark.visible) {
          spark.userData.life -= dt;
          if (spark.userData.life <= 0) {
            spark.visible = false;
            spark.material.opacity = 0;
          } else {
            spark.material.opacity = Math.max(0, spark.userData.life / 0.6);
            spark.position.add(spark.userData.vel.clone().multiplyScalar(dt * 60));
            spark.userData.vel.y -= dt * 1.5;
            const s = spark.userData.life * 2;
            spark.scale.setScalar(Math.max(0.2, s));
          }
        }
      });

      bloom.strength = raceActive ? (SETTINGS.bloomStrength + Math.sin(time * 6) * 0.1) : SETTINGS.bloomStrength - 0.2;

      composer.render();
    }
    animate();

    // ============ EVENTOS (con soporte táctil) ============
    const handleStart = (e) => {
      e.preventDefault();
      initAudio();
      playEngine();
      speedFlash.classList.add('active');
      setTimeout(() => speedFlash.classList.remove('active'), 500);
      phase1.classList.add('hidden');
      phase2.classList.remove('hidden');
    };
    startBtn.addEventListener('click', handleStart);
    startBtn.addEventListener('touchend', handleStart, { passive: false });

    const handleRepeat = (e) => {
      e.preventDefault();
      startRace(activeCarType);
    };
    repeatBtn.addEventListener('click', handleRepeat);
    repeatBtn.addEventListener('touchend', handleRepeat, { passive: false });

    const handleGarage = (e) => {
      e.preventDefault();
      removeActiveCar();
      raceActive = false;
      raceFinished = false;
      currentSpeed = 0;
      phraseActive = false;
      raceSubtitle.classList.remove('visible');
      phase4.classList.add('hidden');
      phase2.classList.remove('hidden');
      skipBtn.classList.remove('show');
      camera.position.set(0, 8, 25);
      camera.lookAt(0, 0, 0);
      camera.fov = 65;
      camera.updateProjectionMatrix();
    };
    garageBtn.addEventListener('click', handleGarage);
    garageBtn.addEventListener('touchend', handleGarage, { passive: false });

    const handleSkip = (e) => {
      e.preventDefault();
      if (raceActive) {
        carProgress = 0.99;
        phraseActive = false;
        raceSubtitle.classList.remove('visible');
      }
    };
    skipBtn.addEventListener('click', handleSkip);
    skipBtn.addEventListener('touchend', handleSkip, { passive: false });

    // ✅ Resize con debounce
    let resizeTimeout;
    function handleResize() {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        const w = window.innerWidth;
        const h = window.innerHeight;

        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        composer.setSize(w, h);

        if (isMobile && h > w) {
          rotateHint.classList.add('show');
        } else {
          rotateHint.classList.remove('show');
        }
      }, 150);
    }
    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', handleResize);

    if (isMobile && window.innerHeight > window.innerWidth) {
      rotateHint.classList.add('show');
      setTimeout(() => rotateHint.classList.remove('show'), 5000);
    }

    // ✅ Pausar render cuando la pestaña no está visible
    document.addEventListener('visibilitychange', () => {
      isPaused = document.hidden;
      if (!isPaused) clock.getDelta();
    });

    // ✅ Prevenir zoom con gestos en móvil
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
